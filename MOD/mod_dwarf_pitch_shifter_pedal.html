<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOD Dwarf Pitch-Shifter — TONE3000 x guky667</title>
    <!-- Tailwind CSS (Local / CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* System font stack optimized for embedded MOD-UI WebView (zero font downloads) */
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: transparent;
            min-height: 100vh;
            color: #e2e8f0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-mono-custom {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        /* Landscape Pedal Main Chassis */
        .pedal-chassis {
            background: linear-gradient(135deg, #1a0c33 0%, #2b174a 40%, #15082a 75%, #0e041d 100%);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(157, 78, 221, 0.4);
        }

        /* Inner Anodized Faceplate */
        .faceplate {
            background: radial-gradient(ellipse at 50% 40%, #291547 0%, #1c0c33 70%, #120524 100%);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 2px 8px rgba(0, 0, 0, 0.5);
            border: 2px solid #522185;
        }

        /* Screw Hardware */
        .screw {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #cbd5e1 0%, #64748b 60%, #1e293b 100%);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.7), 0 1px 3px rgba(0,0,0,0.6);
            position: relative;
        }
        .screw::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 2px;
            background: #0f172a;
            transform: translate(-50%, -50%) rotate(40deg);
        }

        /* TS 1/4" Side Jacks */
        .jack-housing {
            background: linear-gradient(180deg, #94a3b8 0%, #475569 50%, #1e293b 100%);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.5);
        }
        .jack-hex-nut {
            background: repeating-conic-gradient(#cbd5e1 0% 30deg, #64748b 30deg 60deg);
            border: 1px solid #334155;
        }

        /* Stomp Footswitch & LED */
        .footswitch-housing {
            background: radial-gradient(circle at 40% 40%, #cbd5e1 0%, #64748b 60%, #1e293b 100%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.7);
        }
        .footswitch-button {
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #cbd5e1 40%, #64748b 80%, #1e293b 100%);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.8);
            transition: transform 0.08s ease;
        }
        .footswitch-button:active, .footswitch-button.pressed {
            transform: scale(0.93) translateY(2px);
        }

        /* Bypass Jewel LED */
        .jewel-led {
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        .jewel-led.active {
            background: radial-gradient(circle at 35% 35%, #a7f3d0 0%, #39ff14 50%, #059669 80%, #022c22 100%);
            box-shadow: 0 0 10px #39ff14, inset 0 0 4px rgba(255,255,255,0.8);
        }
        .jewel-led.bypassed {
            background: radial-gradient(circle at 35% 35%, #f472b6 0%, #7b2cbf 60%, #140326 100%);
            opacity: 0.55;
        }

        /* Lightweight Rotary Controls */
        .knob-container {
            touch-action: none;
            cursor: ns-resize;
        }
        .knob-cap {
            background: radial-gradient(circle at 30% 30%, #334155 0%, #1e293b 65%, #0f172a 95%);
            box-shadow: 0 4px 8px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.3);
            border: 2px solid #475569;
            will-change: transform;
        }
        .knob-pointer-green {
            background: #39ff14;
            box-shadow: 0 0 4px #39ff14;
        }
        .knob-pointer-violet {
            background: #c084fc;
            box-shadow: 0 0 4px #c084fc;
        }

        /* Toggle Switch */
        .toggle-switch-base {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
            border: 1px solid #475569;
        }
        .toggle-lever {
            background: linear-gradient(180deg, #f8fafc 0%, #94a3b8 40%, #475569 80%, #334155 100%);
            box-shadow: 0 3px 6px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.9);
            transition: transform 0.12s ease-out;
        }
    </style>
</head>
<body class="p-2 sm:p-4">

                            <!-- Lever -->

                                <line x1="80" y1="80" x2="72" y2="72" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />

    <!-- LIGHTWEIGHT, OPTIMIZED CONTROLLER LOGIC -->
    <script>
        // Exact LV2 defaults matching controlls.txt
        const state = {
            semitones: 0.0,   // Port index 2: -24.0 to +24.0
            step: 1,          // Port index 3: 0 or 1
            window: 1,        // Port index 4: 0, 1, 2, 3 (20ms, 30ms, 40ms, 60ms)
            tonality: 20000.0,// Port index 5: 1000.0 to 20000.0 Hz (log)
            mix: 100.0,       // Port index 6: 0.0 to 100.0 %
            bypass: false
        };

        const windowLabels = ["20 ms", "30 ms", "40 ms", "60 ms"];

        function valToAngle(val, min, max) {
            return -135 + ((val - min) / (max - min)) * 270;
        }

        // Optimized batch UI update (Direct DOM modifications without unnecessary repaints)
        function updateUI() {
            // 1. Pitch
            let pitchVal = state.semitones;
            if (state.step === 1) pitchVal = Math.round(pitchVal);
            document.getElementById('cap-pitch').style.transform = `rotate(${valToAngle(pitchVal, -24, 24)}deg)`;
            document.getElementById('val-pitch').innerText = `${pitchVal > 0 ? '+' : ''}${pitchVal.toFixed(state.step === 1 ? 0 : 1)} st`;

            // 2. Step Toggle Switch (No 1/0 numbers, clean On/Off indicators)
            const lever = document.getElementById('lever-step');
            const ledOn = document.getElementById('led-step-on');
            const ledOff = document.getElementById('led-step-off');
            const valStep = document.getElementById('val-step');

            if (state.step === 1) {
                lever.style.transform = 'translateY(-11px)';
                ledOn.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#39ff14]';
                ledOff.className = 'w-2 h-2 rounded-full bg-purple-950 border border-purple-800';
                valStep.innerText = 'On';
                valStep.className = 'text-xs font-mono-custom font-bold text-emerald-400 bg-slate-950/90 px-2 py-0.5 rounded border border-purple-900';
            } else {
                lever.style.transform = 'translateY(11px)';
                ledOn.className = 'w-2 h-2 rounded-full bg-emerald-950 border border-emerald-800';
                ledOff.className = 'w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_6px_#c084fc]';
                valStep.innerText = 'Off';
                valStep.className = 'text-xs font-mono-custom font-bold text-purple-300 bg-slate-950/90 px-2 py-0.5 rounded border border-purple-900';
            }

            // 3. Window Rotary Selector (True Drag-to-rotate snapped to 4 positions: -135, -45, 45, 135 deg)
            const windowAngles = [-135, -45, 45, 135];
            document.getElementById('cap-window').style.transform = `rotate(${windowAngles[state.window]}deg)`;
            document.getElementById('val-window').innerText = windowLabels[state.window];

            // 4. Tonality (Logarithmic)
            const logMin = Math.log10(1000);
            const logMax = Math.log10(20000);
            const tonalityNorm = (Math.log10(state.tonality) - logMin) / (logMax - logMin);
            document.getElementById('cap-tonality').style.transform = `rotate(${-135 + tonalityNorm * 270}deg)`;
            document.getElementById('val-tonality').innerText = state.tonality >= 10000 
                ? (state.tonality / 1000).toFixed(1) + ' kHz'
                : (state.tonality / 1000).toFixed(2) + ' kHz';

            // 5. Mix
            document.getElementById('cap-mix').style.transform = `rotate(${valToAngle(state.mix, 0, 100)}deg)`;
            document.getElementById('val-mix').innerText = `${Math.round(state.mix)} %`;

            // 6. Bypass LED
            const jewel = document.getElementById('bypass-jewel');
            jewel.className = state.bypass
                ? 'jewel-led bypassed w-4 h-4 rounded-full border-2 border-slate-700'
                : 'jewel-led active w-4 h-4 rounded-full border-2 border-slate-700';
        }

        // Generic Pointer Drag Handler (Supports Pitch, Window, Tonality, Mix)
        function attachKnobEvents(elementId, paramKey, min, max, isLog = false, isEnum = false) {
            const el = document.getElementById(elementId);
            let startY = 0;
            let startVal = 0;
            let isDragging = false;

            function onPointerDown(e) {
                isDragging = true;
                startY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
                startVal = state[paramKey];
                document.addEventListener('pointermove', onPointerMove);
                document.addEventListener('pointerup', onPointerUp);
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const currentY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
                const deltaY = startY - currentY;

                if (isEnum) {
                    // Snap window steps based on vertical displacement
                    const stepDiff = Math.round(deltaY / 30);
                    let newStep = startVal + stepDiff;
                    newStep = Math.max(min, Math.min(max, newStep));
                    if (state[paramKey] !== newStep) {
                        state[paramKey] = newStep;
                        updateUI();
                    }
                } else if (isLog) {
                    const logMin = Math.log10(min);
                    const logMax = Math.log10(max);
                    let logVal = Math.log10(startVal) + (deltaY * (logMax - logMin) / 160);
                    logVal = Math.max(logMin, Math.min(logMax, logVal));
                    state[paramKey] = Math.pow(10, logVal);
                    updateUI();
                } else {
                    const sensitivity = (max - min) / 160;
                    let newVal = startVal + deltaY * sensitivity;
                    newVal = Math.max(min, Math.min(max, newVal));
                    if (paramKey === 'semitones' && state.step === 1) newVal = Math.round(newVal);
                    state[paramKey] = newVal;
                    updateUI();
                }
            }

            function onPointerUp() {
                isDragging = false;
                document.removeEventListener('pointermove', onPointerMove);
                document.removeEventListener('pointerup', onPointerUp);
            }

            el.addEventListener('pointerdown', onPointerDown);

            el.addEventListener('wheel', (e) => {
                e.preventDefault();
                const dir = e.deltaY < 0 ? 1 : -1;
                if (isEnum) {
                    let nextVal = state[paramKey] + dir;
                    state[paramKey] = Math.max(min, Math.min(max, nextVal));
                } else if (isLog) {
                    const logMin = Math.log10(min);
                    const logMax = Math.log10(max);
                    let logVal = Math.log10(state[paramKey]) + (dir * 0.03);
                    logVal = Math.max(logMin, Math.min(logMax, logVal));
                    state[paramKey] = Math.pow(10, logVal);
                } else {
                    const stepVal = (paramKey === 'semitones' && state.step === 1) ? 1 : (max - min) / 30;
                    let newVal = state[paramKey] + dir * stepVal;
                    newVal = Math.max(min, Math.min(max, newVal));
                    if (paramKey === 'semitones' && state.step === 1) newVal = Math.round(newVal);
                    state[paramKey] = newVal;
                }
                updateUI();
            });
        }

        // Attach Rotary Controllers
        attachKnobEvents('knob-pitch', 'semitones', -24.0, 24.0);
        attachKnobEvents('knob-window', 'window', 0, 3, false, true);
        attachKnobEvents('knob-tonality', 'tonality', 1000.0, 20000.0, true);
        attachKnobEvents('knob-mix', 'mix', 0.0, 100.0);

        // Toggle Switch Click
        document.getElementById('switch-step').addEventListener('click', () => {
            state.step = state.step === 1 ? 0 : 1;
            if (state.step === 1) state.semitones = Math.round(state.semitones);
            updateUI();
        });

        // Bypass Footswitch
        const footswitch = document.getElementById('footswitch-btn');
        const plunger = document.getElementById('footswitch-plunger');
        footswitch.addEventListener('click', () => {
            state.bypass = !state.bypass;
            plunger.classList.add('pressed');
            setTimeout(() => plunger.classList.remove('pressed'), 100);
            updateUI();
        });

        // Initial Paint
        window.onload = updateUI;
    </script>
</body>
</html>
